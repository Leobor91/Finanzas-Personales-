<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-light">
  {% include 'header.html' %}
  <div class="container py-4">
    <div class="card centered p-4 mx-auto" style="max-width:540px">
      <h4 class="mb-3">Iniciar sesión</h4>
      {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
      {% endif %}
      <form id="login-form" method="post" action="/ui/login" novalidate>
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input name="username" id="username" class="form-control" required minlength="3">
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input name="password" id="password" type="password" class="form-control" required minlength="6">
        </div>
        <div class="d-flex justify-content-end">
          <button id="login-btn" class="btn btn-primary" type="submit" disabled>Entrar</button>
        </div>
      </form>
      <div id="login-alert" class="mt-3"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function(){
      // If we were redirected after logout, clear client storage and remove URL param
      try{
        const params = new URLSearchParams(window.location.search);
        if(params.get('logged_out')){
          try{ localStorage.clear(); }catch(e){}
          try{ sessionStorage.clear(); }catch(e){}
          // replace history entry so Back won't go to authenticated pages
          const url = window.location.origin + window.location.pathname;
          window.history.replaceState({}, document.title, url);
          // optionally show a brief message
          const alertPlaceholder = document.getElementById('login-alert');
          if(alertPlaceholder) alertPlaceholder.innerHTML = `<div class="alert alert-success" role="alert">Sesión cerrada correctamente</div>`;
        }
      }catch(e){/* ignore */}
      const form = document.getElementById('login-form');
      const alertPlaceholder = document.getElementById('login-alert');
      const loginBtn = document.getElementById('login-btn');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      function updateLoginState() {
        try {
          const u = (usernameInput && usernameInput.value || '').trim();
          const p = (passwordInput && passwordInput.value) || '';
          // respect minlength attributes (username >=3, password >=6)
          const ok = (u.length >= 3) && (p.length >= 6);
          if (loginBtn) loginBtn.disabled = !ok;
        } catch (e) { if (loginBtn) loginBtn.disabled = true; }
      }
      // attach listeners to update state as user types
      if (usernameInput) usernameInput.addEventListener('input', updateLoginState);
      if (passwordInput) passwordInput.addEventListener('input', updateLoginState);
      // initial state
      updateLoginState();
      function showAlert(msg, type='danger'){
        alertPlaceholder.innerHTML = `<div class="alert alert-${type}" role="alert">${msg}</div>`;
      }
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertPlaceholder.innerHTML = '';
        const formData = new FormData(form);
        const username = (formData.get('username')||'').trim();
        const password = formData.get('password')||'';
        if(!username || !password){
          showAlert('Usuario y contraseña requeridos');
          return;
        }
        try{
          const res = await fetch(form.action, { method: 'POST', body: formData, headers: { 'X-Requested-With': 'XMLHttpRequest' } });
          const js = await res.json().catch(()=>null);
          if(res.ok && js && js.ok){
            // success: redirect to index
            window.location.href = '/';
            return;
          }
          const err = js && js.error ? js.error : (res.statusText || 'Credenciales inválidas');
          showAlert(err);
        }catch(err){
          showAlert('Error de conexión');
        }
      });
    })();
  </script>
</body>
</html>
