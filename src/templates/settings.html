<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configuración — Base de Datos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
    {% include 'header.html' %}
    <div class="container">
        <div class="card centered settings-card p-4 mt-4">

            <form method="post" action="/settings" class="row g-3">
                <div class="col-12">
                    <label class="form-label">Bases de datos detectadas</label>
                    <select id="existing_db" name="existing_db" class="form-select">
                        <option value="">(ninguna seleccionada)</option>
                        {% for f in db_files %}
                        <option value="{{ f }}" {% if f==current_db %}selected{% endif %}>{{ f }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label">O escribir nombre de archivo</label>
                    <input id="db_name" name="db_name" type="text" class="form-control" value="{{ current_db }}">
                    <div class="form-text">Puede usar un nombre relativo (ej: finance_app.db) o una ruta absoluta.</div>
                </div>

                <div class="col-12">
                    <button class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    </div> <!-- close content-offset -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // If user selects an existing DB, populate the text field
        document.getElementById('existing_db').addEventListener('change', function () {
            const v = this.value || '';
            if (v) document.getElementById('db_name').value = v;
        });
    </script>
</body>

</html>
